# The Grant Key — contact form Worker
# Deploy:  cd worker && npm install && npx wrangler deploy
# See README.md for the full setup (Turnstile, verified email address).

name = "grantkey-contact"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = false

# Intercept ONLY the form endpoint. Every other path on the domain continues
# to be served by GitHub Pages.
routes = [
  { pattern = "thegrantkey.com/api/contact", zone_name = "thegrantkey.com" }
]

# Cloudflare Email Routing send binding (TOP-LEVEL — must not sit under [vars]).
# Left unrestricted so the recipient address stays out of this public file; it
# can still only deliver to a VERIFIED destination address on the account, and
# the code only ever sends to the CONTACT_TO secret.
send_email = [
  { name = "CONTACT_EMAIL" }
]

[vars]
# "From" address on outgoing mail. Does NOT need to be a real mailbox — it just
# has to be on thegrantkey.com (SPF already authorises _spf.mx.cloudflare.net).
FROM_ADDRESS = "form@thegrantkey.com"

# Secrets / private values (NOT stored here) — set once each with:
#   npx wrangler secret put TURNSTILE_SECRET   (Turnstile secret key)
#   npx wrangler secret put CONTACT_TO         (verified Email Routing address
#                                               that submissions are sent to)
